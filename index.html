<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinPage </title>

<!-- 
  FIREBASE SETUP INSTRUCTIONS
  
  1. Зайди на https://console.firebase.google.com
  2. Создай новый проект (бесплатный Spark plan)
  3. Перейди в "Realtime Database" → "Create database" → выбери режим "test mode"
  4. Скопируй URL базы (вида https://YOUR-PROJECT-default-rtdb.firebaseio.com)
  5. Вставь его в переменную FIREBASE_URL ниже
   -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

<style>
/*  THEME VARIABLES  */
:root {
  --bg:         #08090f;
  --bg2:        #0f1220;
  --bg3:        #161b2e;
  --surface:    rgba(15,18,36,0.82);
  --border:     rgba(180,190,255,0.09);
  --border2:    rgba(180,190,255,0.15);
  --text:       #e8eaf6;
  --text2:      #8b92b8;
  --text3:      #4a5080;
  --accent:     #7c6ff7;
  --accent2:    #a78bfa;
  --accent-bg:  rgba(124,111,247,0.12);
  --danger:     #ef4444;
  --danger-bg:  rgba(239,68,68,0.1);
  --nav-h:      54px;
  --radius:     12px;
  --font:       'Syne', system-ui, sans-serif;
  --font-serif: 'Crimson Pro', Georgia, serif;
  --font-mono:  'Syne Mono', monospace;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg:         #f0f0f7;
  --bg2:        #e4e4f0;
  --bg3:        #d8d8ec;
  --surface:    rgba(255,255,255,0.82);
  --border:     rgba(80,80,160,0.12);
  --border2:    rgba(80,80,160,0.22);
  --text:       #1a1a3a;
  --text2:      #4a4a7a;
  --text3:      #9090b8;
  --accent:     #5b4fe0;
  --accent2:    #7c6ff7;
  --accent-bg:  rgba(91,79,224,0.1);
  color-scheme: light;
}

/*  RESET  */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; font-size: 14px; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
input, textarea, button, select { font-family: inherit; }
input, textarea { outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus, textarea:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(124,111,247,.15); }
button { cursor: pointer; transition: all .18s; }
img { display: block; }

/*  ANIMATIONS  */
@keyframes fadeDown  { from { opacity:0; transform:translateY(-10px) } to { opacity:1; transform:translateY(0) } }
@keyframes fadeUp    { from { opacity:0; transform:translateY(10px)  } to { opacity:1; transform:translateY(0) } }
@keyframes slideIn   { from { opacity:0; transform:translateX(32px)  } to { opacity:1; transform:translateX(0) } }
@keyframes notifPop  { from { opacity:0; transform:translateX(-50%) scale(.92) } to { opacity:1; transform:translateX(-50%) scale(1) } }
@keyframes spin      { to { transform: rotate(360deg) } }
@keyframes shimmer   { from { background-position: -200% 0 } to { background-position: 200% 0 } }

/*  LAYOUT  */
#app    { display:flex; flex-direction:column; height:100vh; }
#nav    { height:var(--nav-h); background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 18px; gap:10px; flex-shrink:0; z-index:200; position:relative; }
#main   { flex:1; overflow:hidden; display:flex; flex-direction:column; transition:opacity .3s ease, transform .3s ease; }

/*  SHARED COMPONENTS  */
.btn { border-radius:22px; padding:6px 16px; font-size:12px; font-weight:600; letter-spacing:.2px; border:1px solid var(--border2); background:transparent; color:var(--text2); }
.btn:hover { color:var(--text); border-color:var(--accent); background:var(--accent-bg); }
.btn-accent { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-accent:hover { background:var(--accent2); border-color:var(--accent2); transform:translateY(-1px); box-shadow:0 4px 16px rgba(124,111,247,.35); }
.btn-danger { color:var(--danger); border-color:rgba(239,68,68,.3); background:var(--danger-bg); }
.btn-danger:hover { background:rgba(239,68,68,.18); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); backdrop-filter:blur(20px); }
.tag  { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:.3px; background:var(--accent-bg); color:var(--accent2); border:1px solid rgba(124,111,247,.2); }

/*  LOADING  */
.loader { width:22px; height:22px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
#loading-screen { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#loading-screen p { color:var(--text3); font-size:13px; letter-spacing:.5px; }

/*  AUTH  */
#auth-screen { flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.auth-bg-blob { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; }
.auth-card { position:relative; z-index:1; width:400px; padding:44px 40px; animation:fadeDown .4s ease; }
.auth-logo { text-align:center; margin-bottom:32px; }
.auth-logo-icon { font-size:40px; line-height:1; margin-bottom:10px; }
.auth-logo h1 { font-size:30px; font-weight:800; color:var(--text); letter-spacing:-1px; }
.auth-logo p { font-size:13px; color:var(--text3); margin-top:4px; font-family:var(--font-serif); font-style:italic; }
.auth-tabs { display:flex; background:var(--bg3); border-radius:10px; padding:3px; margin-bottom:28px; gap:3px; }
.auth-tab { flex:1; padding:8px; border-radius:7px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--text3); }
.auth-tab.active { background:var(--accent); color:#fff; box-shadow:0 2px 10px rgba(124,111,247,.4); }
.auth-field { display:flex; flex-direction:column; gap:5px; }
.auth-field label { font-size:11px; font-weight:600; color:var(--text3); letter-spacing:.6px; text-transform:uppercase; }
.auth-input { width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--border2); background:var(--bg3); color:var(--text); font-size:14px; }
.auth-input::placeholder { color:var(--text3); }
.auth-btn { width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:14px; font-weight:700; letter-spacing:.3px; margin-top:8px; }
.auth-btn:hover { background:var(--accent2); transform:translateY(-1px); box-shadow:0 6px 24px rgba(124,111,247,.4); }
.auth-err { color:#f87171; font-size:12px; text-align:center; padding:4px 0; display:none; }

.auth-firebase-note { font-size:11px; color:var(--text3); text-align:center; margin-top:10px; padding:8px 12px; background:var(--bg3); border-radius:8px; border:1px solid var(--border); }
.auth-firebase-note.online { border-color:rgba(52,211,153,.3); color:#34d399; background:rgba(52,211,153,.07); }
.auth-firebase-note.offline { border-color:rgba(251,146,60,.3); color:#fb923c; background:rgba(251,146,60,.07); }

/*  NAV  */
.nav-logo { background:none; border:none; font-size:18px; font-weight:800; color:var(--accent2); letter-spacing:-1px; padding:0; }
.nav-spacer { flex:1; }
.nav-tab { border-radius:20px; border:none; background:transparent; font-size:12px; font-weight:600; color:var(--text3); padding:5px 14px; }
.nav-tab.active { background:var(--accent-bg); color:var(--accent2); }
.nav-tab:hover:not(.active) { color:var(--text); }
.nav-div { width:1px; height:20px; background:var(--border2); }
.nav-username { font-size:12px; color:var(--text2); max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.theme-toggle { width:34px; height:34px; border-radius:50%; border:1px solid var(--border2); background:transparent; color:var(--text2); font-size:15px; display:flex; align-items:center; justify-content:center; }
.theme-toggle:hover { background:var(--accent-bg); color:var(--accent2); border-color:var(--accent); }

/*  WALL  */
#wall-view { flex:1; display:flex; flex-direction:column; overflow:hidden; }
#profile-bar { background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; gap:14px; flex-shrink:0; position:relative; overflow:hidden; }
#wall-canvas { flex:1; position:relative; overflow:hidden; }
.wall-bg { position:absolute; inset:0; }
.wall-dots { position:absolute; inset:0; opacity:0; background-image:radial-gradient(circle, var(--text3) 1px, transparent 1px); background-size:32px 32px; transition:opacity .3s; }
[data-theme="light"] .wall-dots { opacity:.25; }
.wall-dots { opacity:.06; }
#blocks-layer { position:absolute; inset:0; }

/*  BLOCK  */
.block { position:absolute; }
.block-inner { width:100%; height:100%; border-radius:10px; overflow:hidden; transition:box-shadow .2s; }
.block-text-bg { background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(16px); }
.block-music-bg { background:var(--surface); border:1px solid rgba(124,111,247,.25); backdrop-filter:blur(16px); }
.block-text-view { padding:13px 16px; height:100%; overflow:hidden; white-space:pre-wrap; line-height:1.7; }
.block-text-edit { width:100%; height:100%; background:transparent; border:none; outline:none; resize:none; padding:13px 16px; line-height:1.7; color:var(--text); }
.block-del { position:absolute; top:-28px; right:0; padding:3px 10px; border-radius:5px; border:1px solid rgba(239,68,68,.4); background:var(--danger-bg); color:#f87171; font-size:10px; font-weight:600; opacity:0; transition:opacity .2s; white-space:nowrap; letter-spacing:.3px; text-transform:uppercase; }
.block:hover .block-del { opacity:1; }
.block-editing .block-inner { box-shadow:0 0 0 2px var(--accent) !important; }

/* BLOCK CONTROLS - always visible when editing */
.block-ctrl { position:absolute; top:-34px; left:0; display:flex; gap:3px; z-index:10; }
.bc-btn { padding:3px 8px; border-radius:5px; border:1px solid var(--border2); background:var(--bg2); color:var(--text2); font-size:11px; backdrop-filter:blur(8px); line-height:1.5; font-weight:600; }
.bc-btn:hover, .bc-btn:active { border-color:var(--accent); color:var(--accent2); background:var(--accent-bg); }
.bc-del { border-color:rgba(239,68,68,.4)!important; color:#f87171!important; background:rgba(239,68,68,.08)!important; }
.bc-del:hover, .bc-del:active { background:rgba(239,68,68,.2)!important; }

/* RESIZE HANDLES - always visible in edit mode */
.resize-handle { position:absolute; width:14px; height:14px; background:var(--accent); border:2px solid #fff; border-radius:3px; z-index:20; box-shadow:0 1px 4px rgba(0,0,0,.4); }
.rh-se { bottom:-7px; right:-7px;  cursor:se-resize; }
.rh-sw { bottom:-7px; left:-7px;   cursor:sw-resize; }
.rh-ne { top:-7px;    right:-7px;  cursor:ne-resize; }
.rh-nw { top:-7px;    left:-7px;   cursor:nw-resize; }
.rh-e  { top:50%; right:-7px; cursor:e-resize; margin-top:-7px; }
.rh-w  { top:50%; left:-7px;  cursor:w-resize; margin-top:-7px; }
.rh-s  { left:50%; bottom:-7px; cursor:s-resize; margin-left:-7px; }
.rh-n  { left:50%; top:-7px;   cursor:n-resize; margin-left:-7px; }

/* ROTATE HANDLE */
.rot-handle { position:absolute; top:-46px; left:50%; transform:translateX(-50%); width:18px; height:18px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:2px solid #fff; border-radius:50%; cursor:crosshair; z-index:25; box-shadow:0 1px 6px rgba(124,111,247,.5); }
.rot-handle::after { content:''; position:absolute; top:100%; left:50%; width:2px; height:12px; background:var(--accent); transform:translateX(-50%); }

/* RADIUS CONTROL - always visible under image in edit mode */
.radius-ctrl { position:absolute; bottom:-42px; left:0; right:0; background:var(--bg2); border:1px solid var(--border2); border-radius:8px; padding:6px 10px; display:flex; align-items:center; gap:8px; z-index:15; pointer-events:all; }
.radius-lbl { font-size:10px; color:var(--text3); white-space:nowrap; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
.radius-slider { flex:1; accent-color:var(--accent); height:4px; cursor:pointer; min-width:0; }

/* ── MUSIC WIDGET ─────────────────────── */
.block-music-bg { background:var(--surface); border:1px solid rgba(124,111,247,.22); backdrop-filter:blur(14px); }

/* Shell = body (fills all) + vol strip (fixed 14px right) */
.music-shell { display:flex; width:100%; height:100%; overflow:hidden; }
.music-body  { flex:1; min-width:0; overflow:hidden; position:relative; }

/* Inner padding wrapper — all content sits here */
.music-pad   { position:absolute; inset:0; padding:8px 10px; display:flex; flex-direction:column; gap:4px; }

/* Top row: cover + play + info */
.music-row   { display:flex; align-items:center; gap:8px; flex:1; min-height:0; overflow:hidden; }

/* Cover: fixed px size set by JS, never overflows */
.music-cover { flex-shrink:0; border-radius:7px; background:var(--bg3);
               border:1px solid var(--border2); position:relative; overflow:hidden;
               /* width & height set via JS */ }
.music-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.music-cover-placeholder { width:100%; height:100%; display:flex; align-items:center;
               justify-content:center; color:var(--accent2); }
.music-cover-edit-overlay { position:absolute; inset:0; background:rgba(0,0,0,.6);
               display:flex; align-items:center; justify-content:center;
               font-size:18px; color:#fff; opacity:0; transition:opacity .2s; cursor:pointer; }
.music-cover:hover .music-cover-edit-overlay { opacity:1; }

/* Play: size set by JS */
.music-play  { flex-shrink:0; border-radius:50%; border:1.5px solid rgba(124,111,247,.45);
               background:transparent; color:var(--accent2);
               display:flex; align-items:center; justify-content:center; transition:all .15s; }
.music-play:hover,.music-play.on { background:var(--accent-bg); border-color:var(--accent2); }

/* Info: fills remaining space, font set by JS */
.music-info  { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; overflow:hidden; }
.music-title { font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; letter-spacing:-.2px; line-height:1.15; }
.music-artist{ color:var(--text3); white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; font-family:var(--font-serif); font-style:italic; line-height:1.2; }

/* Progress bar */
.music-bar-wrap { height:3px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; flex-shrink:0; }
.music-fill     { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:2px; width:0; transition:width .3s; }

/* Edit inputs */
.music-edit-inp { width:100%; background:rgba(255,255,255,.07); border:1px solid var(--border2);
                  border-radius:5px; color:var(--text); font-size:12px; font-weight:600;
                  font-family:var(--font); padding:3px 7px; outline:none; margin-bottom:3px;
                  display:block; z-index:30; pointer-events:all;
                  -webkit-user-select:text; user-select:text; box-sizing:border-box; }
.music-edit-inp:focus { border-color:var(--accent); background:rgba(124,111,247,.1); }
.music-edit-inp::placeholder { color:var(--text3); }
.music-edit-artist { font-weight:400; color:var(--text2); font-family:var(--font-serif); font-style:italic; }

/* Volume strip */
.music-vol-strip  { width:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
                    padding:6px 0; background:rgba(255,255,255,.03); border-left:1px solid var(--border); }
.music-vol-slider { writing-mode:vertical-lr; direction:rtl;
                    -webkit-appearance:slider-vertical; appearance:slider-vertical;
                    width:3px; height:100%; padding:0;
                    background:rgba(124,111,247,.25); border-radius:3px;
                    accent-color:var(--accent2); cursor:pointer; outline:none; }
.music-vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px;
  border-radius:50%; background:var(--accent2); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.5); }
.music-vol-slider::-moz-range-thumb { width:10px; height:10px; border-radius:50%;
  background:var(--accent2); border:none; cursor:pointer; }

/*  PROFILE BAR  */
.pb-name { font-size:16px; font-weight:700; color:var(--text); letter-spacing:-.3px; }
.pb-bio  { font-size:11px; color:var(--text3); margin-top:1px; font-family:var(--font-serif); font-style:italic; }
.pb-fnav { display:flex; gap:6px; align-items:center; }
.pb-fav  { width:30px; height:30px; border-radius:50%; border-width:1.5px; border-style:solid; font-size:12px; font-weight:700; background:transparent; transition:transform .2s; font-family:var(--font-serif); }
.pb-fav:hover { transform:scale(1.2); }

/*  EDIT TOOLBAR  */
#edit-toolbar { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:20; display:flex; gap:8px; align-items:center; }
.toolbar-pill { padding:9px 20px; border-radius:24px; font-size:13px; font-weight:700; letter-spacing:.2px; backdrop-filter:blur(16px); }
.t-add  { border:1px solid rgba(124,111,247,.4); background:var(--bg); color:var(--accent2); }
.t-add:hover { background:var(--accent-bg); }
.t-save { border:none; background:var(--accent); color:#fff; box-shadow:0 4px 16px rgba(124,111,247,.35); }
.t-save:hover { background:var(--accent2); transform:translateY(-1px); }
.add-menu { position:absolute; bottom:110%; left:0; background:var(--bg2); border:1px solid var(--border2); border-radius:12px; overflow:hidden; backdrop-filter:blur(24px); min-width:190px; display:none; box-shadow:0 8px 36px rgba(0,0,0,.4); animation:fadeDown .2s ease; }
.add-menu.open { display:block; }
.add-item { display:block; width:100%; padding:12px 18px; background:transparent; border:none; color:var(--text2); text-align:left; font-size:13px; font-weight:500; }
.add-item:hover { background:var(--accent-bg); color:var(--accent2); }

/*  FRIENDS  */
#friends-view { flex:1; overflow:auto; padding:24px; }
.section-label { font-size:10px; font-weight:700; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-bottom:14px; }
.user-row { display:flex; align-items:center; gap:13px; padding:11px 0; border-bottom:1px solid var(--border); }
.user-row:last-child { border-bottom:none; }
.fr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:4px; }
.fr-card { padding:18px; cursor:pointer; transition:transform .2s, border-color .2s; }
.fr-card:hover { transform:translateY(-2px); }

/*  AVATAR  */
.av { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; font-family:var(--font-serif); }

/*  NOTIFICATION  */
#notif { position:fixed; top:62px; left:50%; transform:translateX(-50%); z-index:9999; padding:8px 22px; border-radius:24px; font-size:12px; font-weight:600; letter-spacing:.3px; display:none; white-space:nowrap; animation:notifPop .3s ease; backdrop-filter:blur(20px); }

/*  FIREBASE SETUP BANNER  */
#fb-banner { position:fixed; bottom:0; left:0; right:0; z-index:500; background:rgba(251,146,60,.95); color:#fff; font-size:12px; padding:10px 20px; display:none; text-align:center; backdrop-filter:blur(10px); }
#fb-banner a { color:#fff; font-weight:700; }
#fb-banner button { float:right; background:rgba(255,255,255,.25); border:none; color:#fff; border-radius:4px; padding:2px 8px; font-size:11px; cursor:pointer; }

/* ═══════════════════════════════════════
   MOBILE RESPONSIVE
   ═══════════════════════════════════════ */
@media (max-width: 640px) {
  /* Nav */
  #nav { padding:0 10px; gap:6px; height:50px; }
  .nav-logo { font-size:15px; }
  .nav-tab { padding:4px 10px; font-size:11px; }
  .nav-username { display:none; }
  .theme-toggle { width:28px; height:28px; font-size:13px; }
  .btn { padding:4px 10px; font-size:11px; }

  /* Auth */
  .auth-card { width:calc(100vw - 24px); padding:28px 20px; }
  .auth-logo h1 { font-size:24px; }

  /* Profile bar */
  #profile-bar { padding:8px 10px; gap:8px; flex-wrap:wrap; }
  .pb-name { font-size:13px; }
  .pb-bio  { font-size:10px; }
  .pb-fnav { gap:4px; }
  .pb-fav  { width:26px; height:26px; font-size:11px; }

  /* Wall canvas - make scrollable on mobile */
  #wall-canvas { overflow:auto; -webkit-overflow-scrolling:touch; }
  #blocks-layer { min-width:700px; min-height:600px; }

  /* Friends */
  #friends-view { padding:14px; }
  .fr-grid { grid-template-columns:1fr; }
  .user-row { flex-wrap:wrap; gap:8px; padding:10px 0; }
  .user-row .btn { font-size:10px; padding:3px 8px; }

  /* Blocks */
  .bc-btn { padding:4px 8px; font-size:12px; }
  .block-ctrl { top:-36px; gap:4px; }
  .resize-handle { width:16px; height:16px; }
  .rh-se { bottom:-8px; right:-8px; }
  .rh-sw { bottom:-8px; left:-8px; }
  .rh-ne { top:-8px; right:-8px; }
  .rh-nw { top:-8px; left:-8px; }
  .rh-e  { right:-8px; margin-top:-8px; }
  .rh-w  { left:-8px; margin-top:-8px; }
  .rh-s  { bottom:-8px; margin-left:-8px; }
