// ══════════════════════════════════════════════
// DATABASE ABSTRACTION
// ══════════════════════════════════════════════
const DB = {
  async getUser(username) {
    if (USE_FIREBASE) { const u = await FB.get(`users/${username}`); return u; }
    return localDB.users[username] || null;
  },
  async setUser(username, data) {
    if (USE_FIREBASE) { await FB.set(`users/${username}`, data); }
    else { localDB.users[username] = data; lsSave(); }
  },
  async getWall(username) {
    if (USE_FIREBASE) {
      const wall = await FB.get(`walls/${username}`);
      if (!wall) return [];
      return Array.isArray(wall) ? wall : Object.values(wall);
    }
    return JSON.parse(JSON.stringify(localDB.walls[username] || []));
  },
  async setWall(username, blocks) {
    if (USE_FIREBASE) { await FB.set(`walls/${username}`, blocks); }
    else { localDB.walls[username] = blocks; lsSave(); }
  },
  async getFriends(username) {
    if (USE_FIREBASE) {
      const f = await FB.get(`friends/${username}`);
      if (!f) return [];
      return Array.isArray(f) ? f : Object.values(f);
    }
    return [...(localDB.friends[username] || [])];
  },
  async setFriends(username, list) {
    if (USE_FIREBASE) { await FB.set(`friends/${username}`, list); }
    else { localDB.friends[username] = list; lsSave(); }
  },
  async deleteUser(username) {
    if (USE_FIREBASE) { await FB.set('users/'+username, null); await FB.set('walls/'+username, null); await FB.set('friends/'+username, null); }
    else { delete localDB.users[username]; delete localDB.walls[username]; delete localDB.friends[username]; lsSave(); }
  },
  async getBan(username) {
    if (USE_FIREBASE) return await FB.get('bans/'+username);
    return localDB.bans[username]||null;
  },
  async setBan(username, reason) {
    const d={reason,at:new Date().toISOString()};
    if (USE_FIREBASE) await FB.set('bans/'+username, d);
    else { localDB.bans[username]=d; lsSave(); }
  },
  async removeBan(username) {
    if (USE_FIREBASE) await FB.set('bans/'+username, null);
    else { delete localDB.bans[username]; lsSave(); }
  },
  async getAllBans() {
    if (USE_FIREBASE) { const b=await FB.get('bans'); return b||{}; }
    return localDB.bans||{};
  },
  async getWarnings(username) {
    if (USE_FIREBASE) { const w=await FB.get('warnings/'+username); if(!w) return []; return Array.isArray(w)?w:Object.values(w); }
    return localDB.warnings[username]||[];
  },
  async addWarning(username, text) {
    const entry={text,at:new Date().toISOString()};
    const list=await this.getWarnings(username); list.push(entry);
    if (USE_FIREBASE) await FB.set('warnings/'+username, list);
    else { localDB.warnings[username]=list; lsSave(); }
  },
  async clearWarnings(username) {
    if (USE_FIREBASE) await FB.set('warnings/'+username, null);
    else { delete localDB.warnings[username]; lsSave(); }
  },
  async getAllUsers() {
    if (USE_FIREBASE) { const u = await FB.get('users'); return u ? Object.values(u) : []; }
    return Object.values(localDB.users);
  },
};

// ══════════════════════════════════════════════
function $ (id) { return document.getElementById(id); }

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})) {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else e[k] = v;
  }
  for (const c of kids) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

let _notifTimer;
function notify(msg, type='ok') {
  const n = $('notif');
  n.textContent = msg;
  n.style.display = 'block';
  n.style.background = type === 'ok'
    ? 'rgba(124,111,247,.18)' : 'rgba(239,68,68,.18)';
  n.style.border = `1px solid ${type==='ok'?'rgba(124,111,247,.4)':'rgba(239,68,68,.4)'}`;
  n.style.color  = type === 'ok' ? '#a78bfa' : '#f87171';
  clearTimeout(_notifTimer);
  _notifTimer = setTimeout(() => n.style.display='none', 2800);
}

function toggleTheme() {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = S.theme;
  localStorage.setItem('mw_theme', S.theme);
  renderNav();
}

function Avatar(user, size, clickable) {
  size = size || 40;
  const div = el('div', {
    className:'av',
    style:{ width:size+'px', height:size+'px', background:user.color+'22', border:'2px solid '+user.color,
            fontSize:(size*.38)+'px', color:user.color, position:'relative', overflow:'hidden',
            cursor: clickable?'pointer':'default', flexShrink:'0' }
  });
  if(user.avatarImg){
    const img = document.createElement('img');
    img.src = user.avatarImg;
    img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%';
    div.appendChild(img);
  } else {
    div.appendChild(document.createTextNode(user.avatar || user.username[0].toUpperCase()));
  }
  return div;
}

function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

function renderAuth() {
  const main = $('main');

  // blobs
  for (const [c,l,t,s] of [['#7c6ff7','25%','30%','360px'],['#ec4899','70%','65%','280px'],['#10b981','55%','15%','200px']]) {

  }

  screen.appendChild(card);

  // Logo
  const logo = el('div', {className:'auth-logo'});
  logo.appendChild(el('div', {className:'auth-logo-icon'}, '✦'));
  logo.appendChild(el('h1', {}, 'PinPage'));
  // subtitle removed
  card.appendChild(logo);

  // DB status badge
  const statusBadge = el('div', {className:'auth-firebase-note '+(USE_FIREBASE?'online':'offline')},
    USE_FIREBASE ? '🟢 Firebase подключён — общая база данных' : '🟠 localStorage — данные только в этом браузере');
  card.appendChild(statusBadge);

  // Tabs
  let mode = 'login';
  const tabs = el('div', {className:'auth-tabs'});
  const t1 = el('button', {className:'auth-tab active', onClick(){mode='login'; t1.classList.add('active'); t2.classList.remove('active'); dnWrap.style.display='none'; sbtn.textContent='Войти →';}}, 'Войти');
  const t2 = el('button', {className:'auth-tab',        onClick(){mode='reg';   t2.classList.add('active'); t1.classList.remove('active'); dnWrap.style.display='flex'; sbtn.textContent='Создать аккаунт →';}}, 'Регистрация');
  tabs.appendChild(t1); tabs.appendChild(t2); card.appendChild(tabs);

  const fields = el('div', {style:{display:'flex',flexDirection:'column',gap:'14px'}});

  const mkField = (lbl, type, placeholder) => {
    const wrap = el('div', {className:'auth-field'});
    wrap.appendChild(el('label', {}, lbl));
    const inp = el('input', {className:'auth-input', type, placeholder});
    wrap.appendChild(inp);
    return [wrap, inp];
  };

  const [dnWrap, dnInp] = mkField('Имя на сайте', 'text', 'Как тебя звать?');
  dnWrap.style.display = 'none';
  const [, usrInp]  = mkField('Username', 'text', 'только латиница, без пробелов');
  const [, passInp] = mkField('Пароль', 'password', '••••••••');
  const errDiv = el('div', {className:'auth-err'});
  fields.appendChild(dnWrap); fields.appendChild(mkField('Username','text','только латиница')[0]); 
  fields.innerHTML=''; // rebuild properly
  fields.appendChild(dnWrap);
  const usrField = el('div',{className:'auth-field'});
  usrField.appendChild(el('label',{},'Username'));
  usrField.appendChild(usrInp);
  const passField = el('div',{className:'auth-field'});
  passField.appendChild(el('label',{},'Пароль'));
  passField.appendChild(passInp);
  fields.appendChild(usrField); fields.appendChild(passField); fields.appendChild(errDiv);
  card.appendChild(fields);

  const showErr = msg => { errDiv.style.display='block'; errDiv.textContent=msg; };

  const sbtn = el('button', {className:'auth-btn', onClick: doAuth}, 'Войти →');
  card.appendChild(sbtn);
  passInp.addEventListener('keydown', e => { if(e.key==='Enter') doAuth(); });

  async function doAuth() {
    errDiv.style.display = 'none';
    const usr  = usrInp.value.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    const pass = passInp.value;
    sbtn.disabled = true; sbtn.textContent = '...';

    if (mode === 'login') {
      const u = await DB.getUser(usr);
      if (!u)           { showErr('Пользователь не найден'); sbtn.disabled=false; sbtn.textContent='Войти →'; return; }
      if (u.password !== pass) { showErr('Неверный пароль');        sbtn.disabled=false; sbtn.textContent='Войти →'; return; }
      S.currentUser = u; S.viewingUser = usr; S.tab='wall'; S.editing=false;
      renderAll(); notify('С возвращением, '+u.displayName+' ✦');
    } else {
      const dn = dnInp.value.trim();
      if (!dn || !usr || !pass) { showErr('Заполни все поля'); sbtn.disabled=false; sbtn.textContent='Создать аккаунт →'; return; }
      if (usr.length < 3)       { showErr('Username минимум 3 символа'); sbtn.disabled=false; sbtn.textContent='Создать аккаунт →'; return; }
      const existing = await DB.getUser(usr);
      if (existing) { showErr('Username занят'); sbtn.disabled=false; sbtn.textContent='Создать аккаунт →'; return; }
      const colors = ['#7c6ff7','#ec4899','#10b981','#3b82f6','#f59e0b','#ef4444'];
      const color = colors[Math.floor(Math.random()*colors.length)];
      const nu = { username:usr, password:pass, displayName:dn, bio:'', avatar:dn[0].toUpperCase(), color };
      await DB.setUser(usr, nu);
      await DB.setWall(usr, []);
      await DB.setFriends(usr, []);
      S.currentUser = nu; S.viewingUser = usr; S.tab='wall'; S.editing=false;
      renderAll(); notify('Добро пожаловать! ✦');
    }
  }

  const demo = el('div', {className:'auth-demo'});
  demo.innerHTML = 'Демо-аккаунты: <b>nova · kira · echo</b> — пароль <b>1234</b>';
  card.appendChild(demo);

  main.appendChild(screen);
}

  function renderBlocks() {
    if (wallGen !== gen) return;
    layer.innerHTML = '';
    localBlocks.forEach(b => layer.appendChild(makeBlock(b)));
  }

  function makeBlock(block) {
    const wrap = el('div', {className:'block'+(S.editing&&isPinPage?' block-editing':''),
      style:{left:block.x+'px',top:block.y+'px',width:block.w+'px',height:block.h+'px'}});
    const inner = el('div', {className:'block-inner'});
    wrap.appendChild(inner);

    if (block.type === 'text') {
      inner.classList.add('block-text-bg');
      const s = block.style||{};
      const ff = s.family==='serif'?'var(--font-serif)':s.family==='mono'?'var(--font-mono)':'var(--font)';
      const col = s.color||'var(--text)';
      const fs  = (s.fontSize||14)+'px';
      const fst = s.italic?'italic':'normal';
      if (S.editing && isPinPage) {
        const ta = el('textarea', {className:'block-text-edit', style:{fontSize:fs,fontFamily:ff,fontStyle:fst,color:col}});
        ta.value = block.content||'';
        ta.addEventListener('input', ()=>{ const bi=localBlocks.findIndex(b=>b.id===block.id); if(bi>-1) localBlocks[bi].content=ta.value; });
        inner.appendChild(ta);
      } else {
        inner.appendChild(el('div', {className:'block-text-view', style:{fontSize:fs,fontFamily:ff,fontStyle:fst,color:col}}, block.content||''));
      }
    }
    else if (block.type === 'image') {
      const img = el('img', {src:block.content||'', style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'10px'}});
      img.onerror = ()=>{ inner.style.cssText='background:var(--bg3);display:flex;align-items:center;justify-content:center;'; inner.textContent='⚠ Не загрузилось'; inner.style.color='var(--text3)'; inner.style.fontSize='12px'; };
      inner.appendChild(img);
    }
    else if (block.type === 'music') {
      inner.classList.add('block-music-bg');
      let playing = false;
      const fill = el('div', {className:'music-fill'});
      // Create audio element if dataUrl exists
      let audio = null;
      if(block.content.dataUrl) {
        audio = new Audio(block.content.dataUrl);
        audio.addEventListener('ended',()=>{
          playing=false; play.classList.remove('on'); play.textContent='▶';
          fill.style.width='0%'; fill.style.transition='width .3s';
        });
        audio.addEventListener('loadedmetadata',()=>{
          if(playing){ fill.style.transition='width '+(audio.duration||60)+'s linear'; fill.style.width='100%'; }
        });
      }
      const play = el('button', {className:'music-play'}, '▶');
      play.addEventListener('click', ()=>{
        playing=!playing;
        play.classList.toggle('on',playing);
        play.textContent = playing?'⏸':'▶';
        if(audio){
          if(playing){ audio.play().catch(()=>{}); fill.style.width='100%'; fill.style.transition='width '+(audio.duration||60)+'s linear'; }
          else{ audio.pause(); fill.style.width='0%'; fill.style.transition='width .3s'; }
        } else {
          fill.style.width  = playing?'70%':'0%';
          fill.style.transition = playing?'width 8s linear':'width .3s';
        }
      });
      const minfo = el('div', {className:'music-info'});
      minfo.appendChild(el('div',{className:'music-title'},block.content.title||'Unknown'));
      minfo.appendChild(el('div',{className:'music-artist'},block.content.artist||''));
      const bar2 = el('div',{className:'music-bar-wrap'}); bar2.appendChild(fill);
      minfo.appendChild(bar2);
      const mw = el('div',{className:'music-wrap'});
      mw.appendChild(play); mw.appendChild(minfo);
      inner.appendChild(mw);
    }

    // ── Edit controls (drag, resize, rotate, z-order, delete)
    if (S.editing && isPinPage) {
      // Top controls bar
      const ctrl = el('div', {className:'block-ctrl'});

      // Delete
      const del = el('button', {className:'bc-btn bc-del', title:'Удалить',
        onClick(e){ e.stopPropagation(); localBlocks=localBlocks.filter(b=>b.id!==block.id); renderBlocks(); }
      }, '✕');
      // Layer up
      const lUp = el('button', {className:'bc-btn', title:'Выше',
        onClick(e){ e.stopPropagation();
          const bi=localBlocks.findIndex(b=>b.id===block.id);
          if(bi<localBlocks.length-1){ [localBlocks[bi],localBlocks[bi+1]]=[localBlocks[bi+1],localBlocks[bi]]; renderBlocks(); }
        }
      }, '↑');
      // Layer down
      const lDn = el('button', {className:'bc-btn', title:'Ниже',
        onClick(e){ e.stopPropagation();
          const bi=localBlocks.findIndex(b=>b.id===block.id);
          if(bi>0){ [localBlocks[bi],localBlocks[bi-1]]=[localBlocks[bi-1],localBlocks[bi]]; renderBlocks(); }
        }
      }, '↓');
      // Reset rotation button
      const rReset = el('button', {className:'bc-btn', title:'Сбросить поворот',
        onClick(e){ e.stopPropagation();
          const bi=localBlocks.findIndex(b=>b.id===block.id);
          if(bi>-1){ localBlocks[bi].rot=0; applyTransform(); }
        }
      }, '⊕');
      ctrl.appendChild(lUp); ctrl.appendChild(lDn); ctrl.appendChild(rReset); ctrl.appendChild(del);
      wrap.appendChild(ctrl);

      function applyTransform(){
        const b=localBlocks.find(b=>b.id===block.id);
        if(b) wrap.style.transform=`rotate(${b.rot||0}deg)`;
      }
      applyTransform();

      // Drag-to-rotate handle (circle at top-center)
      const rotHandle = el('div', {className:'rot-handle', title:'Тяни для поворота'});
      wrap.appendChild(rotHandle);
      rotHandle.addEventListener('mousedown', e=>{
        e.stopPropagation(); e.preventDefault();
        const rect = wrap.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI;
        const bi = localBlocks.findIndex(b=>b.id===block.id);
        const startRot = (bi>-1 ? localBlocks[bi].rot : 0) || 0;
        document.body.style.userSelect='none';
        const mm = ev=>{
          const rect2 = wrap.getBoundingClientRect();
          const cx2 = rect2.left + rect2.width/2;
          const cy2 = rect2.top + rect2.height/2;
          const curAngle = Math.atan2(ev.clientY - cy2, ev.clientX - cx2) * 180/Math.PI;
          const delta = curAngle - startAngle;
          if(bi>-1){ localBlocks[bi].rot = startRot + delta; applyTransform(); }
        };
        const mu=()=>{ document.body.style.userSelect=''; window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
        window.addEventListener('mousemove',mm);
        window.addEventListener('mouseup',mu);
      });

      // Resize handles: SE, SW, NE, NW, E, W, N, S
      const resizeDirs = [
        {cls:'rh-se',dx:1,dy:1,cx:0,cy:0},
        {cls:'rh-sw',dx:-1,dy:1,cx:1,cy:0},
        {cls:'rh-ne',dx:1,dy:-1,cx:0,cy:1},
        {cls:'rh-nw',dx:-1,dy:-1,cx:1,cy:1},
        {cls:'rh-e', dx:1,dy:0,cx:0,cy:0},
        {cls:'rh-w', dx:-1,dy:0,cx:1,cy:0},
        {cls:'rh-s', dx:0,dy:1,cx:0,cy:0},
        {cls:'rh-n', dx:0,dy:-1,cx:0,cy:1},
      ];
      resizeDirs.forEach(({cls,dx,dy,cx,cy})=>{
        const h=el('div',{className:'resize-handle '+cls});
        let rs=false,rsx=0,rsy=0,rbw=0,rbh=0,rbx=0,rby=0;
        h.addEventListener('mousedown',e=>{
          e.stopPropagation();e.preventDefault();
          rs=true;rsx=e.clientX;rsy=e.clientY;
          const b=localBlocks.find(b=>b.id===block.id);
          if(b){rbw=b.w;rbh=b.h;rbx=b.x;rby=b.y;}
          document.body.style.userSelect='none';
          const mm=ev=>{
            if(!rs)return;
            const ddx=ev.clientX-rsx, ddy=ev.clientY-rsy;
            const bi=localBlocks.findIndex(b=>b.id===block.id);
            if(bi<0)return;
            let nw=rbw+(dx*ddx), nh=rbh+(dy*ddy);
            let nx=rbx+(cx?ddx:0), ny=rby+(cy?ddy:0);
            nw=Math.max(80,nw); nh=Math.max(40,nh);
            localBlocks[bi].w=nw; localBlocks[bi].h=nh;
            localBlocks[bi].x=nx; localBlocks[bi].y=ny;
            wrap.style.width=nw+'px'; wrap.style.height=nh+'px';
            wrap.style.left=nx+'px'; wrap.style.top=ny+'px';
          };
          const mu=()=>{rs=false;document.body.style.userSelect='';window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
          window.addEventListener('mousemove',mm);
          window.addEventListener('mouseup',mu);
        });
        wrap.appendChild(h);
      });

      // Drag
      let drag=false,sx=0,sy=0,bx=0,by=0;
      wrap.addEventListener('mousedown', e=>{
        if(e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON'||e.target.classList.contains('resize-handle')) return;
        drag=true; e.preventDefault();
        const b=localBlocks.find(b=>b.id===block.id);
        if(b){bx=b.x;by=b.y;}
        sx=e.clientX; sy=e.clientY;
        wrap.style.cursor='grabbing'; wrap.style.zIndex=50;
        document.body.style.userSelect='none';
      });
      window.addEventListener('mousemove', e=>{
        if(!drag) return;
        const nx=bx+(e.clientX-sx), ny=by+(e.clientY-sy);
        const bi=localBlocks.findIndex(b=>b.id===block.id);
        if(bi>-1){localBlocks[bi].x=nx;localBlocks[bi].y=ny;}
        wrap.style.left=nx+'px'; wrap.style.top=ny+'px';
      });
      window.addEventListener('mouseup', ()=>{
        if(!drag) return;
        drag=false; wrap.style.cursor='grab'; wrap.style.zIndex='';
        document.body.style.userSelect='';
      });
      wrap.style.cursor='grab';
    } else {
      inner.style.boxShadow='0 4px 20px rgba(0,0,0,.3)';
    }
    // Apply saved rotation even when not editing
    if(block.rot) wrap.style.transform=`rotate(${block.rot}deg)`;
    // Apply z-index from array order
    wrap.style.zIndex = localBlocks.findIndex(b=>b.id===block.id)+1;
    return wrap;
  }

  renderBlocks();

  // ── Edit toolbar (file upload based)
  if (S.editing && isPinPage) {
    let menuOpen = false;
    const toolbar = el('div', {id:'edit-toolbar'});
    const menu = el('div', {className:'add-menu'});

    // Hidden file inputs
    const imgInput = el('input',{type:'file',accept:'image/*',style:{display:'none'}});
    const audInput = el('input',{type:'file',accept:'audio/*',style:{display:'none'}});
    document.body.appendChild(imgInput);
    document.body.appendChild(audInput);

    imgInput.addEventListener('change', ()=>{
      const file=imgInput.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=e=>{
        localBlocks.push({id:'b'+Date.now(),type:'image',x:60+Math.random()*150,y:60+Math.random()*150,w:240,h:180,rot:0,content:e.target.result});
        renderBlocks();
      };
      reader.readAsDataURL(file);
      imgInput.value='';
    });

    audInput.addEventListener('change', ()=>{
      const file=audInput.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=e=>{
        const name=file.name.replace(/\.[^.]+$/,'');
        localBlocks.push({id:'b'+Date.now(),type:'music',x:60+Math.random()*150,y:60+Math.random()*150,w:280,h:78,rot:0,content:{title:name,artist:'',dataUrl:e.target.result}});
        renderBlocks();
      };
      reader.readAsDataURL(file);
      audInput.value='';
    });

    const addOpt = (lbl, type) => {
      menu.appendChild(el('button', {className:'add-item', onClick(){
        menu.classList.remove('open'); menuOpen=false;
        if (type==='text')  { localBlocks.push({id:'b'+Date.now(),type:'text',x:60+Math.random()*180,y:60+Math.random()*180,w:260,h:115,rot:0,content:'Твой текст...',style:{fontSize:14,color:'',italic:false}}); renderBlocks(); }
        if (type==='image') imgInput.click();
        if (type==='music') audInput.click();
      }}, lbl));
    };
    addOpt('📝  Текст',       'text');
    addOpt('🖼  Изображение с устройства', 'image');
    addOpt('🎵  Музыка с устройства',      'music');

    const addBtn = el('button', {className:'toolbar-pill t-add', onClick(){menuOpen=!menuOpen; menu.classList.toggle('open',menuOpen);}}, '+ Добавить блок');
    const saveBtn = el('button', {
      className:'toolbar-pill t-save',
      async onClick() {
        saveBtn.disabled=true; saveBtn.textContent='Сохраняем...';
        await DB.setWall(vu, deepClone(localBlocks));
        S.editing=false; S._adminEditingAs=null;
        if(S.currentUser.username==='leha249' && vu!==S.currentUser.username){S.tab='admin';}
        renderMain(); notify('Стена сохранена ✓');
      }
    }, 'Сохранить');

    const aw = el('div',{style:{position:'relative'}});
    aw.appendChild(menu); aw.appendChild(addBtn);
    toolbar.appendChild(aw); toolbar.appendChild(saveBtn);
    canvas.appendChild(toolbar);

    document.addEventListener('click', e=>{ if(!aw.contains(e.target)){menu.classList.remove('open');menuOpen=false;} });
  }

  view.appendChild(canvas);
  main.appendChild(view);
}

// ══════════════════════════════════════════════
// ADMIN PANEL
// ══════════════════════════════════════════════
async function renderAdmin() {
  const main = $('main');
  main.innerHTML='<div id="loading-screen"><div class="loader"></div><p>Загружаем панель...</p></div>';
  main.style.overflow='auto';

  const [allUsers, allBans] = await Promise.all([DB.getAllUsers(), DB.getAllBans()]);
  const warnCounts = {};
  await Promise.all(allUsers.map(async u=>{ warnCounts[u.username]=(await DB.getWarnings(u.username)).length; }));

  main.innerHTML='';
  const wrap = el('div', {style:{padding:'24px',animation:'fadeUp .3s ease',minHeight:'100%'}});

  // Header
  const hdr = el('div', {style:{display:'flex',alignItems:'center',gap:'14px',marginBottom:'28px'}});
  hdr.appendChild(el('div',{style:{fontSize:'28px'}},'⚡'));
  const ht = el('div');
  ht.appendChild(el('h2',{style:{fontSize:'22px',fontWeight:'800',letterSpacing:'-1px',color:'var(--text)'}},'Админ-панель'));
  ht.appendChild(el('p',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},`${allUsers.length} пользователей · ${Object.keys(allBans).length} банов`));
  hdr.appendChild(ht);
  wrap.appendChild(hdr);

  // Search
  const searchInp = el('input',{type:'text',placeholder:'🔍 Поиск по username или имени...',style:{width:'100%',padding:'10px 14px',borderRadius:'9px',border:'1px solid var(--border2)',background:'var(--bg3)',color:'var(--text)',fontSize:'13px',marginBottom:'16px',outline:'none'}});
  wrap.appendChild(searchInp);

  // Table
  const tableWrap = el('div',{className:'card',style:{overflow:'hidden'}});
  const tableHead = el('div',{style:{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 1fr 2fr',padding:'10px 16px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',fontSize:'10px',fontWeight:'700',color:'var(--text3)',letterSpacing:'.8px',textTransform:'uppercase'}});
  for(const h of ['Пользователь','Имя','Статус','Варны','Действия']) tableHead.appendChild(el('div',{},h));
  tableWrap.appendChild(tableHead);
  const tableBody = el('div');
  tableWrap.appendChild(tableBody);
  wrap.appendChild(tableWrap);

  function renderRows(filter=''){
    tableBody.innerHTML='';
    const filtered = allUsers.filter(u=>u.username!=='leha249' && (u.username+u.displayName).toLowerCase().includes(filter.toLowerCase()));
    if(!filtered.length){ tableBody.appendChild(el('div',{style:{padding:'30px',textAlign:'center',color:'var(--text3)'}},'Ничего не найдено')); return; }
    filtered.forEach(u=>{
      const banned=!!allBans[u.username];
      const wc=warnCounts[u.username]||0;
      const row=el('div',{style:{display:'grid',gridTemplateColumns:'2fr 1.5fr 1fr 1fr 2fr',padding:'12px 16px',borderBottom:'1px solid var(--border)',alignItems:'center',background:banned?'rgba(239,68,68,.04)':'transparent',transition:'background .15s'}});
      row.onmouseenter=()=>row.style.background=banned?'rgba(239,68,68,.07)':'rgba(255,255,255,.02)';
      row.onmouseleave=()=>row.style.background=banned?'rgba(239,68,68,.04)':'transparent';

      // Avatar + username
      const nc=el('div',{style:{display:'flex',alignItems:'center',gap:'8px'}});
      nc.appendChild(Avatar(u,28));
      const ni=el('div');
      ni.appendChild(el('div',{style:{fontSize:'12px',fontWeight:'700',fontFamily:'var(--font-mono)',color:'var(--text)'}},'@'+u.username));
      nc.appendChild(ni); row.appendChild(nc);
      row.appendChild(el('div',{style:{fontSize:'13px',color:'var(--text2)'}},u.displayName));

      // Status pill
      const sp=el('div');
      sp.appendChild(el('span',{style:{padding:'2px 9px',borderRadius:'12px',fontSize:'10px',fontWeight:'700',background:banned?'rgba(239,68,68,.15)':'rgba(16,185,129,.12)',color:banned?'#f87171':'#34d399',border:'1px solid '+(banned?'rgba(239,68,68,.3)':'rgba(16,185,129,.3)')}},banned?'БАН':'✓ ОК'));
      row.appendChild(sp);

      // Warns
      row.appendChild(el('div',{style:{fontSize:'12px',color:wc>0?'#f59e0b':'var(--text3)',fontWeight:wc>0?'700':'400'}},wc>0?`⚠ ${wc}`:'—'));

      // Actions
      const acts=el('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap'}});
      const aBtn=(lbl,col,fn)=>{const b=el('button',{style:{padding:'3px 9px',borderRadius:'7px',fontSize:'11px',fontWeight:'600',border:'1px solid '+col+'44',background:col+'11',color:col},onClick:fn},lbl);return b;};

      acts.appendChild(aBtn('Стена','#7c6ff7',()=>navigateTo(u.username)));
      acts.appendChild(aBtn('Ред. стену','#a78bfa',()=>openWallEditModal(u)));
      acts.appendChild(aBtn('Варн','#f59e0b',()=>openWarnModal(u)));
      if(banned){
        acts.appendChild(aBtn('Разбан','#34d399',async()=>{ await DB.removeBan(u.username); delete allBans[u.username]; renderRows(searchInp.value); notify('Бан снят с @'+u.username); }));
      } else {
        acts.appendChild(aBtn('Бан','#ef4444',()=>openBanModal(u)));
      }
      acts.appendChild(aBtn('Профиль','#8b92b8',()=>openEditModal(u)));
      acts.appendChild(aBtn('Удалить','#ef4444',()=>openDeleteModal(u)));
      row.appendChild(acts);
      tableBody.appendChild(row);
    });
  }
  renderRows();
  searchInp.addEventListener('input',()=>renderRows(searchInp.value));

  // ── MODAL helpers
  function modal(title, buildFn) {
    const ov=el('div',{style:{position:'fixed',inset:'0',background:'rgba(0,0,0,.7)',zIndex:'9000',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)',animation:'fadeDown .2s ease'}});
    const box=el('div',{className:'card',style:{width:'440px',maxWidth:'95vw',padding:'28px',position:'relative',maxHeight:'85vh',overflowY:'auto'}});
    box.appendChild(el('h3',{style:{fontSize:'17px',fontWeight:'800',marginBottom:'18px',color:'var(--text)'}},title));
    const closeBtn=el('button',{style:{position:'absolute',top:'14px',right:'16px',background:'transparent',border:'none',color:'var(--text3)',fontSize:'18px'},onClick(){ov.remove();}},'✕');
    box.appendChild(closeBtn);
    buildFn(box, ()=>ov.remove());
    ov.appendChild(box);
    document.body.appendChild(ov);
  }

  function openBanModal(u){
    modal('🚫 Заблокировать @'+u.username, (box,close)=>{
      box.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'12px',marginBottom:'14px'}},'Пользователь не сможет войти до снятия бана.'));
      const ri=el('input',{type:'text',placeholder:'Причина бана...',style:{width:'100%',padding:'10px 13px',borderRadius:'8px',border:'1px solid var(--border2)',background:'var(--bg3)',color:'var(--text)',fontSize:'13px',marginBottom:'14px',outline:'none'}});
      box.appendChild(ri);
      const btns=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
      btns.appendChild(el('button',{className:'btn',onClick:close},'Отмена'));
      btns.appendChild(el('button',{className:'btn btn-danger',async onClick(){
        await DB.setBan(u.username, ri.value||'Нарушение правил');
        allBans[u.username]={reason:ri.value};
        close(); renderRows(searchInp.value); notify('Пользователь @'+u.username+' заблокирован','err');
      }},'Заблокировать'));
      box.appendChild(btns);
    });
  }

  function openWarnModal(u){
    modal('⚠ Предупреждение: @'+u.username, async (box,close)=>{
      const warns=await DB.getWarnings(u.username);
      if(warns.length){
        const wl=el('div',{style:{marginBottom:'14px',display:'flex',flexDirection:'column',gap:'6px'}});
        warns.forEach(w=>{
          const we=el('div',{style:{padding:'8px 12px',borderRadius:'7px',background:'var(--bg3)',border:'1px solid var(--border)',fontSize:'12px'}});
          we.appendChild(el('div',{style:{fontWeight:'600',color:'var(--text)',marginBottom:'2px'}},w.text));
          we.appendChild(el('div',{style:{color:'var(--text3)',fontSize:'10px',fontFamily:'var(--font-mono)'}},new Date(w.at).toLocaleString('ru')));
          wl.appendChild(we);
        });
        box.appendChild(el('p',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'6px'}},'Предыдущие предупреждения:'));
        box.appendChild(wl);
      }
      const ti=el('textarea',{placeholder:'Текст предупреждения...',style:{width:'100%',height:'80px',padding:'10px 13px',borderRadius:'8px',border:'1px solid var(--border2)',background:'var(--bg3)',color:'var(--text)',fontSize:'13px',resize:'vertical',outline:'none',marginBottom:'14px'}});
      box.appendChild(ti);
      const btns=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
      btns.appendChild(el('button',{className:'btn',onClick:close},'Отмена'));
      if(warns.length) btns.appendChild(el('button',{className:'btn',async onClick(){await DB.clearWarnings(u.username);warnCounts[u.username]=0;close();renderRows(searchInp.value);notify('Варны сброшены');}},'Сбросить все'));
      btns.appendChild(el('button',{className:'btn btn-accent',async onClick(){
        if(!ti.value.trim())return;
        await DB.addWarning(u.username,ti.value.trim());
        warnCounts[u.username]=(warnCounts[u.username]||0)+1;
        close(); renderRows(searchInp.value); notify('Предупреждение отправлено @'+u.username);
      }},'Отправить'));
      box.appendChild(btns);
    });
  }

  function openEditModal(u){
    modal('✎ Редактировать @'+u.username, (box,close)=>{
      const mkF=(lbl,val,type='text')=>{const w=el('div',{style:{display:'flex',flexDirection:'column',gap:'4px',marginBottom:'12px'}});w.appendChild(el('label',{style:{fontSize:'10px',fontWeight:'700',color:'var(--text3)',letterSpacing:'.6px',textTransform:'uppercase'}},lbl));const i=el('input',{type,value:val,style:{width:'100%',padding:'9px 13px',borderRadius:'8px',border:'1px solid var(--border2)',background:'var(--bg3)',color:'var(--text)',fontSize:'13px',outline:'none'}});w.appendChild(i);return[w,i];};
      const [,dnI]=mkF('Отображаемое имя',u.displayName);
      const [,avI]=mkF('Аватар (1 символ)',u.avatar);
      const [,clI]=mkF('Цвет (hex)',u.color);
      const [,biI]=mkF('Bio',u.bio||'');
      const [,pwI]=mkF('Новый пароль (оставь пустым)','','password');
      // Avatar image upload
      const avUpload=el('div',{style:{marginBottom:'12px'}});
      avUpload.appendChild(el('label',{style:{display:'block',fontSize:'10px',fontWeight:'700',color:'var(--text3)',letterSpacing:'.6px',textTransform:'uppercase',marginBottom:'5px'}},'Аватар-фото'));
      const avFileInp=el('input',{type:'file',accept:'image/*',style:{width:'100%',padding:'6px',borderRadius:'8px',border:'1px solid var(--border2)',background:'var(--bg3)',color:'var(--text)',fontSize:'12px'}});
      avUpload.appendChild(avFileInp);
      box.appendChild(avUpload);
      box.appendChild(dnI.parentElement);box.appendChild(avI.parentElement);box.appendChild(clI.parentElement);box.appendChild(biI.parentElement);box.appendChild(pwI.parentElement);
      const btns=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'4px'}});
      btns.appendChild(el('button',{className:'btn',onClick:close},'Отмена'));
      btns.appendChild(el('button',{className:'btn btn-accent',async onClick(){
        const updated={...u,displayName:dnI.value.trim()||u.displayName,avatar:avI.value.trim()[0]||u.avatar,color:clI.value.trim()||u.color,bio:biI.value.trim()};
        if(pwI.value) updated.password=pwI.value;
        // handle avatar image upload
        const avFile=avFileInp.files&&avFileInp.files[0];
        if(avFile){
          await new Promise(res=>{ const r=new FileReader(); r.onload=ev=>{updated.avatarImg=ev.target.result;res();}; r.readAsDataURL(avFile); });
        }
        await DB.setUser(u.username,updated);
        close(); notify('Профиль @'+u.username+' обновлён');
        // refresh local copy
        const idx=allUsers.findIndex(x=>x.username===u.username);
        if(idx>-1) allUsers[idx]=updated;
        renderRows(searchInp.value);
      }},'Сохранить'));
      box.appendChild(btns);
    });
  }

  function openWallEditModal(u){
    modal('🧱 Редактировать стену: @'+u.username, async (box,close)=>{
      box.style.maxWidth='560px';
      box.appendChild(el('p',{style:{color:'var(--text3)',fontSize:'12px',marginBottom:'14px'}},'Стена откроется в режиме правки. Изменения сохранятся в базу данных.'));
      const btns=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
      btns.appendChild(el('button',{className:'btn',onClick:close},'Отмена'));
      btns.appendChild(el('button',{className:'btn btn-accent',onClick(){
        close();
        // Open that user's wall in edit mode
        S.viewingUser = u.username;
        S.tab = 'wall';
        S.editing = true;
        // Override: allow admin to edit other walls
        S._adminEditingAs = u.username;
        renderMain();
        notify('Редактирование стены @'+u.username);
      }},'Открыть в режиме правки'));
      box.appendChild(btns);
    });
  }

  function openDeleteModal(u){
    modal('🗑 Удалить @'+u.username, (box,close)=>{
      box.appendChild(el('p',{style:{color:'#f87171',fontSize:'13px',marginBottom:'18px'}},'⚠ Это действие нельзя отменить. Все данные пользователя, его стена и список друзей будут удалены навсегда.'));
      const btns=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
      btns.appendChild(el('button',{className:'btn',onClick:close},'Отмена'));
      btns.appendChild(el('button',{className:'btn btn-danger',async onClick(){
        await DB.deleteUser(u.username);
        const idx=allUsers.findIndex(x=>x.username===u.username);
        if(idx>-1) allUsers.splice(idx,1);
        close(); renderRows(searchInp.value); notify('Аккаунт @'+u.username+' удалён','err');
      }},'Удалить навсегда'));
      box.appendChild(btns);
    });
  }

  main.appendChild(wrap);
}

// ══════════════════════════════════════════════
// NAVIGATION WITH TRANSITION
// ══════════════════════════════════════════════
function navigateTo(username) {
  if (S.viewingUser===username && S.tab==='wall') return;
  S.tab='wall'; S.editing=false;
  const main = $('main');
  main.style.opacity='0';
  main.style.transform='translateX(28px)';
  main.style.transition='opacity .3s ease, transform .3s ease';
  setTimeout(()=>{
    main.style.transition='';
    main.style.opacity='1';
    main.style.transform='';
    S.viewingUser=username;
    renderMain();
  }, 300);
}

// ══════════════════════════════════════════════
// MAIN
// ══════════════════════════════════════════════
function renderAll() { renderNav(); renderMain(); }

function renderMain() {
  const main = $('main');
  main.style.transition=''; main.style.opacity='1'; main.style.transform='';
  renderNav();
  if (!S.currentUser)          { renderAuth();   return; }
  if (S.tab==='friends')        { renderFriends(); return; }
  if (S.tab==='admin' && S.currentUser.username==='leha249') { renderAdmin(); return; }
  if (S.viewingUser && (USE_FIREBASE || localDB.users[S.viewingUser])) { renderWall(); return; }
  renderWall();
}

renderAll();
</script>
</body>
</html>
